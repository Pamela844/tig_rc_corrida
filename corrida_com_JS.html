<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Corrida com JS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050507;
            color: #fff;
        }

        .pagina {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .menu-carros {
            width: 220px;
            padding: 24px 18px;
            background: rgba(240, 8, 140, 0.2);
            border-right: 3px solid #ef2b2b;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .menu-carros ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .menu-carros li{
            display: flex;
            gap: 10px;
            padding: 10px 6px;
            border-bottom: 1px solid #29292e;
            

        }

        .posicao {
            width: 22px;
            color: #888;
            font-weight: bold;
            text-align: right;
            border-right: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div class="pagina">
        <aside id="menu-carros" class="menu-carros">
           <h1 id="titulo">Race 50</h1>
                <ul id="listarPilotos">

        <main class="corrida">

    <script>
        //JSON objects
        const piloto1 = {

        titulo.innerText = "DJ Netinho";

        const menuCarros = document.getElementById("menu-carros");

        const novoP= document.createElement("p");
        novoP.innerText = "Novo P";
        menuCarros.append(novoP);

        // 1. Apanhar o elemento do html
        const listarPilotos = document.getElementById("listarPilotos");

        pilotos2.forEach((piloto, index) => {
            console.log(index)
            console.log(piloto.morada);

            const novoli = document.createElement("li");
            const spanPosicao = document.createElement('span');

            spanPosicao.className = "posicao";
            spanPosicao.innerText = index +1;

            //criar um span para o nome do piloto

            const spanNome = document.createElement('span');
            spanNome.innerText = piloto.nome;

            //adicionar equipa ao li
            //passo1: criar um span para a equipa
            const spanEquipa = document.createElement('span');
            spanEquipa.classNome = "equipa";
            spanEquipa.innerText = piloto.equipa;

            novoli.append(spanPosicao, spanNome, spanEquipa);

            //novoli.innerText = piloto.nome;
            
            listarPilotos.append(novoli);

        });
